services:
  relay:
    build:
      context: ..
      dockerfile: deployment/relay-server.Dockerfile
    image: clipbridge-relay:${CLIPBRIDGE_VERSION:-local}
    restart: unless-stopped
    environment:
      CLIPBRIDGE_LISTEN: ":8080"
      CLIPBRIDGE_DATABASE_PATH: /var/lib/clipbridge/clipbridge.db
      CLIPBRIDGE_JWT_SECRET: "${CLIPBRIDGE_JWT_SECRET:?CLIPBRIDGE_JWT_SECRET is required}"
      CLIPBRIDGE_ALLOWED_ORIGIN: "${CLIPBRIDGE_ALLOWED_ORIGIN:-}"
      CLIPBRIDGE_LOG_LEVEL: "${CLIPBRIDGE_LOG_LEVEL:-info}"
      CLIPBRIDGE_MAX_QUEUED_MESSAGES: "${CLIPBRIDGE_MAX_QUEUED_MESSAGES:-1000}"
      CLIPBRIDGE_MAX_QUEUED_BYTES: "${CLIPBRIDGE_MAX_QUEUED_BYTES:-10485760}"
      DASHBOARD_PASSWORD: "${DASHBOARD_PASSWORD:-}"
    volumes:
      - ./data:/var/lib/clipbridge
      - /sys/class/net:/sys/class/net:ro
      - /proc:/host-proc:ro
      - /etc/wireguard:/etc/wireguard:ro
      - /etc/shadowsocks-libev:/etc/shadowsocks-libev:ro
      - /tmp/wg-dump:/tmp/wg-dump:ro
    ports:
      - "127.0.0.1:${CLIPBRIDGE_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:1.29-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    environment:
      CLIPBRIDGE_DOMAIN: "${CLIPBRIDGE_DOMAIN:?CLIPBRIDGE_DOMAIN is required}"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./monitor:/usr/share/nginx/html/dashboard:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

