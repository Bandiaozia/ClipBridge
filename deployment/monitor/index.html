<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #1e1e2e;
    --text: #e4e4ed;
    --muted: #6b6b7b;
    --green: #2dd4bf;
    --red: #f87171;
    --amber: #fbbf24;
    --bar-bg: #1e1e2e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 80px 24px 48px;
  }
  .main { width: 100%; max-width: 680px; }
  h1 { font-size: 22px; font-weight: 500; letter-spacing: -0.3px; }
  .sub { color: var(--muted); font-size: 13px; margin: 4px 0 28px; }
  .section { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; margin: 32px 0 10px; }

  .row {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px 20px; margin-bottom: 8px;
    transition: border-color 0.2s;
  }
  .row:hover { border-color: #2a2a3e; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.up   { background: var(--green); box-shadow: 0 0 8px rgba(45,212,191,0.5); }
  .dot.down { background: var(--red);   box-shadow: 0 0 8px rgba(248,113,113,0.5); }
  .info { flex: 1; min-width: 0; }
  .info .name { font-size: 15px; font-weight: 500; }
  .info .desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .meta { text-align: right; flex-shrink: 0; }
  .meta div { font-size: 12px; color: var(--muted); line-height: 1.6; }

  .gauges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
  .gauge {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; text-align: center;
  }
  .gauge .val { font-size: 22px; font-weight: 500; }
  .gauge .lbl { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .gauge .bar {
    margin-top: 10px; height: 4px; border-radius: 2px; background: var(--bar-bg); overflow: hidden;
  }
  .gauge .bar div {
    height: 100%; border-radius: 2px;
    transition: width 0.8s ease;
  }

  .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; text-align: center;
  }
  .stat .val { font-size: 20px; font-weight: 500; }
  .stat .lbl { font-size: 11px; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.5px; }

  .footer { text-align: center; color: var(--muted); font-size: 11px; margin-top: 32px; }
</style>
</head>
<body>
<div class="main">
  <h1>Dashboard</h1>
  <p class="sub">clipbridge.ccttkx.xyz</p>

  <!-- System -->
  <div class="section">System</div>
  <div class="gauges">
    <div class="gauge">
      <div class="val" id="cpu">--</div>
      <div class="lbl">CPU</div>
      <div class="bar"><div style="width:0" id="cpu-bar"></div></div>
    </div>
    <div class="gauge">
      <div class="val" id="mem">--</div>
      <div class="lbl">Memory</div>
      <div class="bar"><div style="width:0" id="mem-bar"></div></div>
    </div>
    <div class="gauge">
      <div class="val" id="disk">--</div>
      <div class="lbl">Disk Free</div>
      <div class="bar"><div style="width:0" id="disk-bar"></div></div>
    </div>
  </div>

  <!-- Services -->
  <div class="section">Services</div>

  <div class="row">
    <div class="dot" id="b-dot"></div>
    <div class="info">
      <div class="name">ClipBridge</div>
      <div class="desc">E2E clipboard relay</div>
    </div>
    <div class="meta">
      <div id="b-uptime">--</div>
      <div id="b-latency">--</div>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat"><div class="val" id="b-users">--</div><div class="lbl">Users</div></div>
    <div class="stat"><div class="val" id="b-devices">--</div><div class="lbl">Devices</div></div>
  </div>

  <div class="row">
    <div class="dot" id="s-dot"></div>
    <div class="info">
      <div class="name">Shadowsocks</div>
      <div class="desc">Proxy :8388</div>
    </div>
    <div class="meta"><div id="s-latency">--</div></div>
  </div>

  <div class="row">
    <div class="dot" id="w-dot"></div>
    <div class="info">
      <div class="name">WireGuard</div>
      <div class="desc">VPN wg0</div>
    </div>
    <div class="meta"><div id="w-latency">--</div></div>
  </div>

  <div class="footer">Refreshed <span id="tick">--</span></div>
</div>

<script>
const BASE = '';

function uptime(s) {
  if (!s || s <= 0) return '--';
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  if (d) return d + 'd ' + h + 'h';
  if (h) return h + 'h ' + m + 'm';
  return m + 'm';
}

function barColor(pct) {
  if (pct > 80) return 'var(--red)';
  if (pct > 60) return 'var(--amber)';
  return 'var(--green)';
}

async function get(path) {
  const t0 = performance.now();
  try {
    const r = await fetch(BASE + path, { signal: AbortSignal.timeout(5000) });
    return { ok: true, ms: Math.round(performance.now() - t0), data: await r.json() };
  } catch {
    return { ok: false, ms: Math.round(performance.now() - t0) };
  }
}

async function tick() {
  const [sys, b, s, w] = await Promise.all([
    get('/stats/system'),
    get('/stats'),
    get('/proxy/shadowsocks'),
    get('/proxy/wireguard'),
  ]);

  // System
  if (sys.ok) {
    const cpu = sys.data.cpu_percent || 0;
    const memUsed = sys.data.mem_total_mb - (sys.data.mem_avail_mb || 0);
    const memPct = sys.data.mem_total_mb ? (memUsed / sys.data.mem_total_mb * 100) : 0;
    const diskPct = sys.data.disk_total_gb ? ((sys.data.disk_total_gb - sys.data.disk_avail_gb) / sys.data.disk_total_gb * 100) : 0;

    document.getElementById('cpu').textContent = cpu + '%';
    document.getElementById('cpu-bar').style.width = cpu + '%';
    document.getElementById('cpu-bar').style.background = barColor(cpu);

    document.getElementById('mem').textContent = Math.round(memUsed) + ' / ' + sys.data.mem_total_mb + ' MB';
    document.getElementById('mem-bar').style.width = memPct + '%';
    document.getElementById('mem-bar').style.background = barColor(memPct);

    document.getElementById('disk').textContent = (sys.data.disk_avail_gb || 0).toFixed(0) + ' GB';
    document.getElementById('disk-bar').style.width = (100 - diskPct) + '%';
    document.getElementById('disk-bar').style.background = barColor(100 - diskPct);
  }

  // ClipBridge
  const bd = document.getElementById('b-dot');
  if (b.ok) {
    bd.className = 'dot up';
    document.getElementById('b-uptime').textContent = uptime(b.data.uptime_seconds) || '--';
    document.getElementById('b-latency').textContent = b.ms + 'ms';
    document.getElementById('b-users').textContent = b.data.users ?? '--';
    document.getElementById('b-devices').textContent = b.data.devices ?? '--';
  } else {
    bd.className = 'dot down';
    document.getElementById('b-uptime').textContent = 'offline';
    document.getElementById('b-latency').textContent = '--';
    document.getElementById('b-users').textContent = '--';
    document.getElementById('b-devices').textContent = '--';
  }

  // Shadowsocks
  document.getElementById('s-dot').className = 'dot ' + (s.ok && s.data.online ? 'up' : 'down');
  document.getElementById('s-latency').textContent = s.ms ? s.ms + 'ms' : '--';

  // WireGuard
  document.getElementById('w-dot').className = 'dot ' + (w.ok && w.data.online ? 'up' : 'down');
  document.getElementById('w-latency').textContent = w.ms ? w.ms + 'ms' : '--';

  document.getElementById('tick').textContent = new Date().toLocaleTimeString('zh-CN');
}

tick();
setInterval(tick, 5000);
</script>
</body>
</html>
